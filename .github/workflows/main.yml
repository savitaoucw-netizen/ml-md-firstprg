name: Automated Feature Engineering CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirement.txt

    - name: Lint Code with Flake8
      run: |
        flake8 src main.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Unit Tests with Pytest
      run: |
        python -m pytest src/ -v

    - name: Execute Feature Engineering Pipeline
      run: |
        python main.py --config configs/config.yaml

    - name: Upload Serialized Preprocessor Artifact
      uses: actions/upload-artifact@v4
      with:
        name: feature-engineering-artifact
        path: "*.joblib"
