```yaml
name: Automated Feature Engineering CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Check Repository Structure
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Check Required Files
        run: |
          test -f requirements.txt
          test -f main.py
          test -f configs/config.yaml

          echo "All required files are present."

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Installed Packages
        run: |
          python --version
          python -m pip list

      - name: Lint Code with Flake8
        run: |
          python -m flake8 src main.py \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Run Unit Tests with Pytest
        run: |
          python -m pytest src/ -v

      - name: Execute Feature Engineering Pipeline
        run: |
          python main.py --config configs/config.yaml

      - name: Upload Serialized Preprocessor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-engineering-artifact
          path: "*.joblib"
          if-no-files-found: error
